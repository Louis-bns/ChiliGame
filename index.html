<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🌶️ Die Reise zum Mythischen Chili</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🌶️ Die Reise zum Mythischen Chili</h1>

  <div id="startscreen">
    <img src="assets/Startbild.png" alt="Startbild" />
    <div class="press-enter">Press Enter</div>
  </div>

  <div id="game-wrap">
    <div id="side-image">
      <img src="assets/Liste.png" alt="Side Artwork">
    </div>

    <div id="game">
      <button id="restartBtn" type="button">Restart (R)</button>
      <div id="player"></div>


      <div id="batTpl" class="bat"></div>
      <div id="wolfTpl" class="wolf"></div>
        <div id="cowTpl" class="cow" style="display:none"></div>
    </div>
  </div>

  <script src="levels/level1.js"></script>
  <script src="levels/level2.js"></script>
  <script src="levels/level3.js"></script>
  <script src="game.js"></script>
</body>
</html>
